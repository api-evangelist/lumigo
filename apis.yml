aid: lumigo
name: Lumigo
description: >-
  Lumigo is an observability and troubleshooting platform for microservices and
  serverless environments. It provides distributed tracing, logs, and metrics
  with automatic, no-code instrumentation for AWS Lambda, Amazon ECS, AWS
  AppSync, API Gateway, Kubernetes, and OpenTelemetry workloads. Lumigo captures
  full request/response payloads for end-to-end traces, maps service
  dependencies, and offers an AI Copilot (with an IDE MCP server) to investigate
  and resolve production issues. First-party tracers and OpenTelemetry
  distributions ship for Node.js, Python, Java, Go, and .NET, alongside a CLI, a
  Serverless Framework plugin, CDK constructs, and a Kubernetes operator. Lumigo
  was surfaced as a portfolio company of Wing Venture Capital.
